<div class="alert alert-info">
  <div class="row g-2 mb-2">
    <div class="col">
      <input
        class="form-control form-control-sm"
        placeholder="name"
        [(ngModel)]="name"
      />
    </div>
    <div class="col">
      <input
        class="form-control form-control-sm"
        placeholder="content"
        [(ngModel)]="content"
      />
    </div>
    <div class="col-auto">
      <button
        class="btn btn-danger btn-sm"
        [disabled]="!canAdd()"
        (click)="addTodo()"
      >
        add
      </button>
    </div>
  </div>

  <div class="row g-0">
    @for (column of columns; track column.status) {
      <div class="col alert m-0 {{ column.cssClass }}">
        <h5>{{ column.title }}</h5>
        @for (todo of todosByStatus()[column.status]; track todo.id) {
          <div class="card mb-2">
            <div class="card-body p-2">
              <strong>{{ todo.name }}</strong> : {{ todo.content }}
              <div class="d-flex gap-2 mt-2">
                <select
                  class="form-select form-select-sm"
                  [ngModel]="todo.status"
                  (ngModelChange)="updateStatus(todo.id, $event)"
                >
                  @for (option of columns; track option.status) {
                    <option [value]="option.status">{{ option.status }}</option>
                  }
                </select>
                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="deleteTodo(todo.id)"
                >
                  <i class="fa fa-trash" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
