<h2>TTC Calculator</h2>

<div class="row mb-2">
  <div class="col">
    <input
      id="price"
      type="number"
      min="0"
      class="form-control"
      [(ngModel)]="price"
    />
    <label for="price" class="form-text">Prix HT</label>
  </div>
  <div class="col">
    <input
      id="quantity"
      type="number"
      min="1"
      class="form-control"
      [(ngModel)]="quantity"
    />
    <label for="quantity" class="form-text">Quantité</label>
  </div>
  <div class="col">
    <input
      id="tva"
      type="number"
      min="0"
      class="form-control"
      [(ngModel)]="tva"
    />
    <label for="tva" class="form-text">TVA</label>
  </div>
</div>

<div class="row g-0">
  <div class="col alert alert-info">
    Prix unitaire TTC : {{ unitPriceTtc() | currency }}
  </div>
  <div class="col alert alert-success">
    Prix total TTC : {{ totalTtc() | currency }}
  </div>
  <div class="col alert alert-danger">
    Discount : {{ discount() | currency }}
  </div>
</div>
